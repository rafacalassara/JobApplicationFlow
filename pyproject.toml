[project]
name = "job-application-flow-mcp"
version = "0.1.0"
description = "MCP Server for Job Application Flow - AI-powered job application automation"
authors = [
    {name = "Rafael Calassara", email = "rafacalassara@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.0.0",
    "crewai>=0.86.0",
    "crewai-tools>=0.17.0",
    "gradio>=5.4.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "pdfplumber>=0.11.4",
    "weasyprint>=64.1",
    "pypdfium2>=4.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.1",
]

[build-system]
requires = ["setuptools>=75.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[project.scripts]
job-application-mcp = "mcp_server:main"
