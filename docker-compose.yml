version: "3.8"

services:
  # Gradio Web Application
  gradio-app:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    container_name: job-application-gradio
    ports:
      - "${GRADIO_SERVER_PORT:-7860}:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - GRADIO_SERVER_NAME=${GRADIO_SERVER_NAME:-0.0.0.0}
      - GRADIO_SERVER_PORT=${GRADIO_SERVER_PORT:-7860}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
    volumes:
      - ./outputs:/usr/src/app/outputs
      - ./inputs:/usr/src/app/inputs
    restart: unless-stopped
    networks:
      - job-application-network

  # MCP Server (Model Context Protocol)
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: job-application-mcp
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
    volumes:
      - ./outputs:/usr/src/app/outputs
      - ./inputs:/usr/src/app/inputs
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - job-application-network

networks:
  job-application-network:
    driver: bridge
